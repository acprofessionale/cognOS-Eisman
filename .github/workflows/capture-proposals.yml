name: Capture Proposals

on:
  pull_request:
    paths:
      - 'capture/proposals.py'
      - 'capture/real_photo_gate.py'
      - 'schemas/capture/proposal-v1.schema.json'
      - 'tests/test_proposals.py'
      - '.github/workflows/capture-proposals.yml'
  push:
    branches: [main]
    paths:
      - 'capture/proposals.py'
      - 'capture/real_photo_gate.py'
      - 'schemas/capture/proposal-v1.schema.json'
      - 'tests/test_proposals.py'
      - '.github/workflows/capture-proposals.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest tests/test_proposals.py -v
      - name: Compile check
        run: python3 -m py_compile capture/capture.py capture/proposals.py capture/real_photo_gate.py tests/test_proposals.py
